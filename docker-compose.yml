services:
  # ─────────────────────────────────────────────────────────────────────────
  # 1) Collector — 네이버 분산 수집 워커 (균열 43 fix, 2026-05-18)
  # ─────────────────────────────────────────────────────────────────────────
  # 옛: marketing-api:latest + COLLECTOR_ONLY=true.
  # 폐기 이유: 2026-05-12 marketing repo commit 0b4b8cd (Phase 14-27 Step 7) 로
  #   `jobs/keyword-pool-cron.job.ts` + `processors/keyword-pool-collect.processor.ts` (Guest/Core/Extra) +
  #   `helper.ts` + `queue.constants.ts` KEYWORD_POOL_* 3개 통째 삭제 → marketing-api 이미지에 EXTRA listen 코드 0건.
  #   서브 PC heartbeat 만 정상 (별도 endpoint), Bull queue 5/12 ~ 5/18 6일째 미가동 = P8 절대 원칙 구조적 위반.
  #
  # 정공법 (균열 43): dataset_api 이미지 사용 + collector 모드 ENV.
  #   - 회사 전용 서비스 (TelegramPolling/HealthWatchJob/IpHealthProbe) 가 WORKER_NAME === "dataset-server-core"
  #     체크로 자동 분기 → 서브 PC 에선 자동 미가동 (코드 0줄 수정).
  #   - dataset 이 fix 원본 (P5) — collector 도 dataset 이미지로 통일 = 의존성 단절.
  #     marketing repo 의 keyword-pool 코드 변경이 서브 collector 에 0 영향.
  collector:
    image: ghcr.io/cho-y-j/marketing-dataset-api:latest
    container_name: home_collector
    restart: unless-stopped
    pull_policy: always
    network_mode: host
    environment:
      WORKER_NAME: "${WORKER_NAME:-collector-home}"
      # dataset_api collector 모드 — EXTRA processor 만 등록.
      # CORE processor 는 항상 등록 → CoreProcessor.shouldProcess() 의 XOR 분기로 자동 통제
      #   (회사 정상 시 서브 CORE skip / 회사 차단 시 서브 CORE fallback).
      DISABLE_KEYWORD_POOL_CRON: "true"        # cron enqueue 회사만
      DISABLE_EXTRA_CRON: "true"
      DISABLE_EXTRA_PROCESSOR: "false"         # EXTRA processor 등록 (서브 핵심 역할)
      DISABLE_GUEST_PROCESSOR: "true"          # GUEST 회사만 (가입자 즉시 측정)
      DISABLE_KEYWORD_POOL_CLEANUP: "true"
      DISABLE_KEYWORD_POOL_PRUNE: "true"
      DISABLE_KEYWORD_POOL_SEED: "true"
      DISABLE_HEARTBEAT_MONITOR: "true"        # 서브가 회사 워커 감시 안 함
      DISABLE_DAILY_REPORT: "true"
      DISABLE_ROLLUP: "true"                   # 롤업 회사만
      COLLECTOR_HEARTBEAT: "true"              # 자기 자신 heartbeat upsert
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      NODE_ENV: production
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node.*main' > /dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ─────────────────────────────────────────────────────────────────────────
  # 2) PostgreSQL Streaming Replica — 자산 백업 (회사 SSD 사망 보험)
  # ─────────────────────────────────────────────────────────────────────────
  # 회사 mk_postgres (master) 의 hot standby. WAL 실시간 streaming.
  # 회사 PC 사망 시 즉시 master 승격 가능 (수동 또는 Patroni).
  # 사전 작업 (회사 PC 에서):
  #   1) postgresql.conf — wal_level=replica, max_wal_senders=10, hot_standby=on
  #   2) pg_hba.conf — host replication replicator 100.64.0.0/10 scram-sha-256
  #   3) replicator 사용자 생성:
  #      CREATE USER replicator WITH REPLICATION ENCRYPTED PASSWORD 'xxx';
  #   4) 자세한 단계는 SETUP.md 참조
  postgres-replica:
    image: postgres:16-alpine  # 회사 mk_postgres 와 동일 버전 (16)
    container_name: home_postgres_replica
    restart: unless-stopped
    network_mode: host  # Tailscale 인터페이스 통해 회사 master 접속
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-admin1234}"
      POSTGRES_DB: marketing_intelligence
      # streaming replication 모드 활성
      PGUSER: replicator
      TZ: Asia/Seoul
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      # 부팅 시 pg_basebackup 으로 master 복제 — entrypoint 안에서 실행
      - ./scripts/replica-init.sh:/docker-entrypoint-initdb.d/replica-init.sh:ro
    # 호스트 포트 5434 노출 — 사장님이 사고 시 직접 접속해서 데이터 조회 가능
    # network_mode: host 라 PORT 매핑 무효 — 컨테이너 내부에서 5432 사용
    # → host 의 5434 사용 위해선 PGPORT=5434 환경변수 + bridge 모드 전환 필요
    # 현재는 단순화 — host 모드 + 컨테이너 5432 (회사와 같은 호스트면 충돌. 다른 미니 PC 라 OK)
    # 나중에 master 승격 시 PORT 5432 그대로 사용하면 회사 master 와 같은 IP:포트 (집 PC IP) 가 됨
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d marketing_intelligence"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────────
  # 3) Uptime Kuma — 모니터링 + 다운 시 알림
  # ─────────────────────────────────────────────────────────────────────────
  # 회사 mk_api / mk_web / mk_postgres 상태 1분마다 체크.
  # 다운 감지 시 카카오톡 / 텔레그램 / 이메일 알림 발송.
  # Web UI 는 집 PC IP:3001 으로 접속 (Tailscale 통해 사장님 어디서든 접근).
  # 사용법: 셋업 후 http://<집PC_Tailscale_IP>:3001 접속 → 회사 endpoint 추가.
  uptime-kuma:
    image: louislam/uptime-kuma:1  # LTS 1.x. 매우 안정적
    container_name: home_uptime_kuma
    restart: unless-stopped
    ports:
      - "3001:3001"  # Web UI
    volumes:
      - uptime_kuma_data:/app/data
    environment:
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD-SHELL", "node /app/extra/healthcheck.js"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────────
  # 4) Watchtower — :latest 태그 자동 폴링 + pull/재시작
  # ─────────────────────────────────────────────────────────────────────────
  # collector 만 자동 갱신 대상. postgres-replica/uptime-kuma 는 안정 버전 고정.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: home_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      TZ: Asia/Seoul
    command: ["--label-enable", "--cleanup", "--interval", "300"]

volumes:
  postgres_replica_data:
  uptime_kuma_data:
